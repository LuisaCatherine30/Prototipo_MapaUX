<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Mapa UMNG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <svg width="0" height="0" style="position:absolute">
        <defs>
            <symbol id="imgI" viewBox="0 0 48 48">
                <rect x="4" y="4" width="40" height="40" rx="8" fill="none" stroke="currentColor" stroke-width="3" />
                <circle cx="16" cy="16" r="4" fill="none" stroke="currentColor" stroke-width="3" />
                <path d="M5 38l12-12 8 8 6-6 12 12" fill="none" stroke="currentColor" stroke-width="3"
                    stroke-linejoin="round" />
            </symbol>
            <symbol id="hp" viewBox="0 0 24 24">
                <path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.800-8 11-8 11z" />
            </symbol>
        </defs>
    </svg>
    <div id="stage">
        <div id="mapPos">
            <div id="inner"><img src="assets/Mapa.PNG" alt="Mapa 3D UMNG"><svg id="rt" viewBox="0 0 905 805"></svg>
                <div id="pins"></div>
            </div>
        </div>

        <div id="side">
            <h2 id="h2"></h2>
            <button class="cat" data-c="acad" style="top:268px;--k:#0C2C47"><img src="assets/cat0.png" alt="">
                <div class="ct"><span class="n"></span><span class="d"></span></div>
            </button>
            <button class="cat" data-c="admin" style="top:423px;--k:#BF512C"><img src="assets/cat1.png" alt="">
                <div class="ct"><span class="n"></span><span class="d"></span></div>
            </button>
            <button class="cat" data-c="aud" style="top:566px;--k:#DA9B2B"><img src="assets/cat2.png" alt="">
                <div class="ct"><span class="n"></span><span class="d"></span></div>
            </button>
            <button class="cat" data-c="cafe" style="top:721px;--k:#ABCBCA"><img src="assets/cat3.png" alt="">
                <div class="ct"><span class="n"></span><span class="d"></span></div>
            </button>
            <button class="cat" data-c="parq" style="top:876px;left:45px;--k:#2E5749"><img src="assets/cat4.png" alt="">
                <div class="ct"><span class="n"></span><span class="d"></span></div>
            </button>
            <div id="tab"><img src="assets/arrow.png" alt="‹"></div>
        </div>

        
        <div id="search"><button id="menu"></button><input id="q" autocomplete="off" spellcheck="false"><button id="flt"></button></div>
        
        <div id="fpanel"><button class="close-btn" id="close-flt">✕</button></div>

        <div class="fb" id="fav"><img src="assets/fav.png" alt=""></div>

        <div class="fb" id="lang"><img src="assets/lang.png" alt=""></div><span id="lb">ES</span>
        <div class="fb" id="ppl"><img src="assets/ppl.png" alt=""></div>
        <div class="fb" id="mapb"><img src="assets/mapb.png" alt=""></div>
        <div class="fb" id="comp"><img src="assets/comp.png" alt=""></div>
        <div class="fb" id="acc"><img id="accI" src="assets/acc.png" alt=""></div>
        <div id="chip"></div>

        <div id="favs">
            <button class="close-btn" id="close-favs">✕</button>
            <h3 id="ft"></h3>
            <div id="fl"></div>
        </div>

    </div>
    <script src="script.js"></script>
</body>

</html>
